<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace | Royal Racing</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #e2b659;
            --dark: #0f0f0f;
            --darker: #050505;
            --text: #d4d4d4;
            --danger: #ff4d4d;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--darker);
            color: var(--text);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        h1, .bebas { font-family: 'Bebas Neue', sans-serif; letter-spacing: 2px; }
        a { text-decoration: none; color: inherit; transition: 0.2s ease-in-out; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--darker); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; gap: 20px;
        }
        
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(226, 182, 89, 0.2);
            border-top-color: var(--gold); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .admin-sidebar {
            width: 280px; background: rgba(10, 10, 10, 0.95);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5); z-index: 10;
        }
        
        .admin-logo {
            padding: 30px 20px; text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--danger); font-family: 'Bebas Neue', sans-serif;
            font-size: 28px; letter-spacing: 3px;
        }
        
        .admin-logo span { color: #fff; }
        
        .admin-nav { flex: 1; padding: 20px 0; }
        .admin-nav a {
            display: flex; align-items: center; gap: 15px; padding: 15px 25px;
            color: #888; font-weight: 600; font-size: 13px; text-transform: uppercase;
            border-left: 3px solid transparent; transition: all 0.2s;
        }
        .admin-nav a:hover, .admin-nav a.active {
            background: rgba(226, 182, 89, 0.05); color: var(--gold);
            border-left-color: var(--gold);
        }
        
        .admin-profile {
            padding: 20px; border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: center; gap: 15px;
        }
        .admin-profile img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--danger); }
        .admin-profile-info { display: flex; flex-direction: column; }
        .admin-profile-name { font-family: 'Bebas Neue', sans-serif; color: #fff; font-size: 18px; letter-spacing: 1px; }
        .admin-profile-role { color: var(--danger); font-size: 10px; font-weight: 800; letter-spacing: 2px; }
        
        .admin-content { flex: 1; overflow-y: auto; padding: 50px; position: relative; }
        .page-header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end; }
        .page-title h1 { font-size: 50px; color: #fff; line-height: 1; }
        .page-title p { color: #888; font-size: 14px; font-weight: 500; margin-top: 5px; }
        
        .btn {
            background: var(--gold); color: var(--darker); padding: 10px 20px;
            font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
            border: none; cursor: pointer; border-radius: 4px; transition: all 0.2s;
        }
        .btn:hover { background: #fff; }
        
        .btn-danger { background: rgba(255, 77, 77, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        
        .admin-card {
            background: rgba(15, 15, 15, 0.8); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px; padding: 30px; margin-bottom: 30px;
        }
        .admin-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .admin-card-title {
            font-size: 18px; color: #fff; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; border-left: 3px solid var(--gold); padding-left: 10px;
        }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; color: #666; font-size: 11px; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.05); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.02); font-weight: 600; font-size: 14px; color: #ccc; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .input-dark {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 8px 12px; border-radius: 4px; font-family: 'Montserrat', sans-serif;
            font-weight: 600; width: 100%; outline: none; transition: border 0.2s;
        }
        .input-dark:focus { border-color: var(--gold); }
        
        .add-form { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 15px; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-label { font-size: 10px; color: #888; text-transform: uppercase; font-weight: 800; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="color: #888; font-size: 12px; font-weight: 600; letter-spacing: 2px;">OVĚŘOVÁNÍ...</div>
    </div>

    <aside class="admin-sidebar">
        <div class="admin-logo">ROYAL <span>ADMIN</span></div>
        <nav class="admin-nav">
            <a href="#" class="active">🏆 Žebříček</a>
            <a href="/">⬅ Zpět</a>
        </nav>
        <div class="admin-profile">
            <img src="https://cdn.discordapp.com/embed/avatars/0.png" id="admin-avatar" alt="Admin">
            <div class="admin-profile-info">
                <div class="admin-profile-name" id="admin-name">Admin</div>
                <div class="admin-profile-role">ORGANIZÁTOR</div>
            </div>
        </div>
    </aside>

    <main class="admin-content">
        <div class="page-header">
            <div class="page-title">
                <h1>ŽEBŘÍČEK</h1>
                <p>Upravuj data jezdců.</p>
            </div>
            <button class="btn" id="save-all-btn">ULOŽIT ZMĚNY NA WEB</button>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">
                <div class="admin-card-title">Přidat jezdce</div>
            </div>
            <div class="add-form">
                <div class="form-group">
                    <label class="form-label">Jméno</label>
                    <input type="text" id="new-name" class="input-dark">
                </div>
                <div class="form-group">
                    <label class="form-label">Výhry</label>
                    <input type="number" id="new-wins" class="input-dark" value="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Pódia</label>
                    <input type="number" id="new-podiums" class="input-dark" value="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Body</label>
                    <input type="number" id="new-points" class="input-dark" value="0">
                </div>
                <button class="btn" id="add-btn" style="height: 35px;">PŘIDAT</button>
            </div>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">
                <div class="admin-card-title">Pořadí</div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Jméno</th>
                        <th>Výhry</th>
                        <th>Pódia</th>
                        <th>Body</th>
                        <th style="text-align: right;">Akce</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        let driversData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Ověření uživatele
                const res = await fetch('/api/user');
                if (!res.ok) return window.location.href = '/';
                const user = await res.json();
                
                // ======== TADY ZADEJ ID TVÉ ROLE ========
                const ADMIN_ROLE_ID = 'SEM_VLOZ_ID_TVY_DISCORD_ROLE'; 
                
                if (!user.roles.includes(ADMIN_ROLE_ID)) {
                    return window.location.href = '/';
                }

                // Nastavení profilu admina vlevo dole
                document.getElementById('admin-name').textContent = user.username.toUpperCase();
                if(user.avatar) {
                    document.getElementById('admin-avatar').src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`;
                }
                
                // Skrytí načítací obrazovky
                document.getElementById('loader').style.display = 'none';

                // Načtení aktuálních dat žebříčku ze serveru
                const dataRes = await fetch('/api/leaderboard');
                driversData = await dataRes.json();
                renderTable();
            } catch(e) { 
                window.location.href = '/'; 
            }
        });

        // Vykreslení tabulky
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            // Seřazení podle bodů (od nejlepšího)
            driversData.sort((a, b) => b.points - a.points);
            
            driversData.forEach((driver, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:var(--gold); font-family:'Bebas Neue'; font-size:20px;">${i+1}.</td>
                    <td><input type="text" class="input-dark" value="${driver.name}" onchange="updateDriver(${driver.id}, 'name', this.value)"></td>
                    <td><input type="number" class="input-dark" value="${driver.wins}" onchange="updateDriver(${driver.id}, 'wins', this.value)" style="width:70px;"></td>
                    <td><input type="number" class="input-dark" value="${driver.podiums}" onchange="updateDriver(${driver.id}, 'podiums', this.value)" style="width:70px;"></td>
                    <td><input type="number" class="input-dark" value="${driver.points}" onchange="updateDriver(${driver.id}, 'points', this.value)" style="width:90px; color:var(--gold);"></td>
                    <td style="text-align:right;"><button class="btn btn-danger" onclick="deleteDriver(${driver.id})">SMAZAT</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Aktualizace dat v poli při změně v inputu
        window.updateDriver = (id, f, v) => {
            const d = driversData.find(x => x.id === id);
            if(d) d[f] = f === 'name' ? v : parseInt(v) || 0;
        };

        // Mazání jezdce
        window.deleteDriver = (id) => {
            if(confirm('Opravdu smazat jezdce?')) { 
                driversData = driversData.filter(x => x.id !== id); 
                renderTable(); 
            }
        };

        // Přidání nového jezdce
        document.getElementById('add-btn').onclick = () => {
            const name = document.getElementById('new-name').value;
            if(!name) return alert('Zadej jméno jezdce!');
            
            driversData.push({
                id: Date.now(), // Unikátní ID
                name: name,
                wins: parseInt(document.getElementById('new-wins').value) || 0,
                podiums: parseInt(document.getElementById('new-podiums').value) || 0,
                points: parseInt(document.getElementById('new-points').value) || 0
            });
            renderTable();
        };

        // Tlačítko ULOŽIT ZMĚNY NA WEB
        document.getElementById('save-all-btn').onclick = async () => {
            const btn = document.getElementById('save-all-btn');
            btn.textContent = 'UKLÁDÁM...';
            
            try {
                const res = await fetch('/api/leaderboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(driversData)
                });
                
                if(res.ok) {
                    alert('Data byla úspěšně uložena a nahrána na web!');
                } else {
                    alert('Chyba! Pravděpodobně nemáš oprávnění organizátora.');
                }
            } catch(e) {
                alert('Chyba při komunikaci se serverem.');
            }
            
            btn.textContent = 'ULOŽIT ZMĚNY NA WEB';
        };
    </script>
</body>
</html>
